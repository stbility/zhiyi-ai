# 提交门禁。
#
# pnpm verify 一直是个好门禁,但此前只在本地手工执行 —— 忘了跑就等于没有。
# 而这个项目已经出过两次「typecheck 和 253 个测试全绿却带着真 bug 上线」
# 的情况,门禁必须自动、必须挡在合并之前。
#
# 不跑 e2e、不连真实数据库:那需要密钥,而密钥不该进 CI。
# 这里只做静态检查与单元测试 —— 它们不需要任何外部服务,也因此永远稳定。
name: verify

on:
  push:
    branches: [main]
  pull_request:

# 同一分支上新的推送取消旧的运行,不必为过时的提交浪费额度
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

# 最小权限:只读仓库内容,不需要写任何东西(CodeQL 告警修复)
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.8.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      # 分开跑而不是直接 pnpm verify:哪一步挂了在 GitHub 的界面上一眼看得到,
      # 不用去翻一整段日志
      - name: 代码规范
        run: pnpm lint

      - name: 类型检查
        run: pnpm typecheck

      - name: 单元测试
        run: pnpm test

      - name: 构建
        run: pnpm build
        env:
          # 构建期不连任何真实服务。给占位值是因为 env/server.ts 会读它们,
          # 缺失时页面会走「未配置」分支 —— 那也能构建通过,但给了值
          # 才能覆盖到正常分支的代码路径。
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
